[workspace]
name = "yosemite-flyover"
description = "A flyover of Yosemite Valley, from Half Dome down to Tunnel View and back, rendered with forge3d"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]

[dependencies]
python = "3.12.*"
numpy = "*"
scipy = "*"
rasterio = "*"
pillow = "*"
ffmpeg = "*"

[pypi-dependencies]
forge3d = ">=1.40.1"

[tasks]
data = "python scripts/fetch_data.py"
prep = { cmd = "python scripts/prep.py", depends-on = ["data"] }
path = "python scripts/flight.py"
preview = { cmd = "python scripts/render.py --preview", depends-on = ["prep"] }
stills = { cmd = "python scripts/render.py --stills 0,10,16,27.7,39.5,42.5,63,72", depends-on = ["prep"] }
render = { cmd = "python scripts/render.py", depends-on = ["prep"] }
